<style>

<body>
<h1>Tuition Fee Tracker</h1>
<div id="al"></div>
<div class="mn"><button class="ib" data-a="prev" aria-label="Previous month">‹</button><b id="ml"></b><button class="ib" data-a="next" aria-label="Next month">›</button></div>

<div class="sm">

<div class="ad"><select id="as"></select><select id="ast" hidden></select><select id="ab"></select></div>

</div>
<p class="mu" style="text-align:center">Saved on this device’s browser. Use the same phone and browser each time.</p>
<div id="hv" hidden></div>
<div id="iv" hidden></div>
<div id="lk" hidden></div>
<script>
var KEY="tuition-fees-v1",S={students:[],pay:{},biz:""},F="all",ED=null,RM=null,PAY=null,PM="Cash",PA="",PE="",DP=null,IV=null;
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.students)S=p}}catch(e){}
S.pay=S.pay||{};S.biz=S.biz||"";
S.students.forEach(function(s){if(!s.join)s.join=s.start+"-01";if(!s.std){var m=/^(\d{1,2})\s*(st|nd|rd|th)\.?\s+(.+)$/i.exec(s.name||"");if(m&&+m[1]>=1&&+m[1]<=12){s.std=String(+m[1]);s.name=m[3]}}});
S.disc=S.disc||{};var Q="",FS="",FB="",HV=null,UNL=!S.pin,DC=null,RV="",RSC=false,MSG="",RT="",LE="",FG=false;
Object.keys(S.pay).forEach(function(k){Object.keys(S.pay[k]).forEach(function(id){var r=S.pay[k][id];if(!Array.isArray(r))S.pay[k][id]=[{d:r.d,a:r.a,m:"Cash"}]})});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var now=new Date(),Y=now.getFullYear(),M=now.getMonth();
function mk(y,m){return y+"-"+String(m+1).padStart(2,"0")}
function cur(){return mk(Y,M)}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function inr(n){return "₹"+Number(n).toLocaleString("en-IN")}
function mlab(k){return new Date(+k.slice(0,4),+k.slice(5)-1,1).toLocaleString("en-IN",{month:"long",year:"numeric"})}
function fd(d){return /^\d{4}-\d{2}-\d{2}$/.test(d)?new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}):d}
function iso(){var t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")}
function pays(s,k){return (S.pay[k]||{})[s.id]||[]}
function dim(y,m){return new Date(y,m+1,0).getDate()}
function ord(n){n=+n;var t=n%100;return n+((t>=11&&t<=13)?"th":["th","st","nd","rd"][n%10<4?n%10:0])}
function stdL(s){return s.std?ord(s.std)+(s.stream?" "+s.stream:""):""}
function dn(s){return (stdL(s)?stdL(s)+" ":"")+s.name}
function tags(s){return [stdL(s),s.board].filter(Boolean)}
function tgh(s){var t=tags(s);return t.length?'<div>'+t.map(function(x){return '<span class="tg">'+esc(x)+'</span>'}).join("")+'</div>':""}
function optStd(v){var o='<option value="">Standard</option>';for(var i=1;i<=12;i++)o+='<option value="'+i+'"'+(String(v)===String(i)?' selected':'')+'>'+ord(i)+'</option>';return o}
function optStr(v){return '<option value="">Stream</option>'+["Science","Commerce","Arts"].map(function(t){return '<option'+(v===t?' selected':'')+'>'+t+'</option>'}).join("")}
function optBrd(v){return '<option value="">Board</option>'+["SSC","CBSE","ICSE"].map(function(t){return '<option'+(v===t?' selected':'')+'>'+t+'</option>'}).join("")}
function renderFl(){var el=document.getElementById("fl"),c1={},c2={};
  S.students.forEach(function(s){if(s.off)return;if(s.std)c1[s.std]=(c1[s.std]||0)+1;if(s.board)c2[s.board]=(c2[s.board]||0)+1});
  if(FS&&!c1[FS])FS="";if(FB&&!c2[FB])FB="";
  var h1='<select id="fs"><option value="">All standards</option>',h2='<select id="fb"><option value="">All boards</option>';
  for(var i=1;i<=12;i++)if(c1[i])h1+='<option value="'+i+'"'+(FS===String(i)?' selected':'')+'>'+ord(i)+' ('+c1[i]+')</option>';
  ["SSC","CBSE","ICSE"].forEach(function(b){if(c2[b])h2+='<option value="'+b+'"'+(FB===b?' selected':'')+'>'+b+' ('+c2[b]+')</option>'});
  el.innerHTML=h1+'</select>'+h2+'</select>'}
var IMGB=null,IMGN="";
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();x.fill()}
function invCanvas(v){
  var s=v.s,F="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif",W=800,rows=[["Fee",inr(v.fee),"#111"]];
  if(v.dsc)rows.push(["Discount","– "+inr(v.dsc),"#111"]);
  rows.push(["Paid",inr(v.paid),"#1f8a4c"]);
  if(v.pt)rows.push(["Earlier pending",inr(v.pt),"#c2410c"]);
  var H=700+rows.length*84+130,c=document.createElement("canvas");c.width=W;c.height=H;
  var x=c.getContext("2d");
  function T(t,px,wt,col,xx,yy,al,mx){x.font=wt+" "+px+"px "+F;while(mx&&px>18&&x.measureText(t).width>mx){px-=2;x.font=wt+" "+px+"px "+F}x.fillStyle=col;x.textAlign=al;x.fillText(t,xx,yy)}
  x.fillStyle="#fff";x.fillRect(0,0,W,H);
  x.fillStyle="#2b4acb";x.fillRect(0,0,W,140);
  T(S.biz||"Fee Invoice",46,"700","#fff",W/2,S.biz?80:88,"center",720);
  if(S.biz)T("FEE INVOICE",24,"600","#dfe6ff",W/2,116,"center");
  T(s.name,58,"700","#111",W/2,225,"center",720);
  var tg=tags(s).join("  ·  ");if(tg)T(tg,32,"500","#555",W/2,276,"center",720);
  T(rl(s,v.k),32,"600","#333",W/2,332,"center",720);
  var ok=v.tot<=0,by=372,bh=250;
  x.fillStyle=ok?"#1f8a4c":"#c2410c";rr(x,40,by,720,bh,28);
  if(ok){x.strokeStyle="#fff";x.lineWidth=22;x.lineCap="round";x.lineJoin="round";x.beginPath();x.moveTo(W/2-55,by+105);x.lineTo(W/2-18,by+142);x.lineTo(W/2+55,by+62);x.stroke();T("FEES PAID",46,"800","#fff",W/2,by+222,"center")}
  else{T("TO PAY",36,"700","#ffe3d2",W/2,by+75,"center");T(inr(v.tot),108,"800","#fff",W/2,by+190,"center",660)}
  rows.forEach(function(r,i){var yy=700+i*84;T(r[0],36,"500","#333",70,yy,"left");T(r[1],40,"700",r[2],W-70,yy,"right");x.fillStyle="#e8e8e8";x.fillRect(60,yy+26,W-120,2)});
  T("Thank you",30,"500","#777",W/2,H-62,"center");T(fd(iso()),24,"400","#aaa",W/2,H-26,"center");
  return c}
function drawIv(){var s=gs(IV.id);if(!s)return;var c=invCanvas(inv(s,IV.k));
  IMGN="Fee-"+s.name.replace(/[^A-Za-z0-9]+/g,"-")+"-"+IV.k+".jpg";IMGB=null;
  document.getElementById("ivimg").src=c.toDataURL("image/jpeg",0.92);
  c.toBlob(function(b){IMGB=b},"image/jpeg",0.92)}
function nk(){return mk(now.getMonth()===11?now.getFullYear()+1:now.getFullYear(),(now.getMonth()+1)%12)}
function ekey(s){return s.off?s.offKey:nk()}
function gs(i){return S.students.filter(function(x){return x.id===i})[0]}
function fb(s,k){var f=Number(s.fee);(s.fees||[]).forEach(function(x){if(x.from<=k)f=Number(x.fee)});return f}
function dc(s,k){return Number(S.disc[k+"|"+s.id])||0}
function feeOf(s,k){return Math.max(0,fb(s,k)-dc(s,k))}
function owe(s){var t=tod(),y=+s.join.slice(0,4),m=+s.join.slice(5,7)-1,tot=0,l=[];while(true){var k=mk(y,m);if(cyc(s,k).a>t)break;var d=dueOf(s,k);if(d>0){tot+=d;l.push({k:k,d:d})}m++;if(m>11){m=0;y++}}return{tot:tot,l:l}}
function remText(s,w){return "Hello! This is a gentle reminder"+(S.biz?" from "+S.biz:"")+" that "+dn(s)+"’s tuition fee of "+inr(w.tot)+" is pending"+(w.l.length>1?" ("+w.l.length+" months)":" ("+rl(s,w.l[0].k)+")")+". Kindly pay at the earliest. Thank you!"}
function rcpt(s,k,i){var ps=pays(s,k),x=ps[i],b=Math.max(0,feeOf(s,k)-sum(ps.slice(0,i+1)));return (S.biz?"*"+S.biz+"*\n":"")+"Payment receipt\nStudent: "+dn(s)+"\nReceived: "+inr(x.a)+" ("+x.m+") on "+fd(x.d)+"\nCycle: "+rl(s,k)+"\nBalance for this cycle: "+inr(b)+(b?"":" – fully paid ✓")+"\nThank you!"}
function ovHead(t){return '<div class="tb"><button class="bt g" data-a="hc">← Back</button><b style="align-self:center;flex:2">'+t+'</b></div>'}
function renderHv(){
  var el=document.getElementById("hv");

  var key=cur(),h="";
  if(HV.t==="hist"){var s=gs(HV.id);if(!s){HV=null;el.hidden=true;return}
    var y=+s.join.slice(0,4),m=+s.join.slice(5,7)-1,ek=ekey(s),rows=[],tp=0,td=0;
    while(mk(y,m)<ek){var k=mk(y,m),d=dueOf(s,k),pd=sum(pays(s,k));tp+=pd;td+=d;

    h=ovHead(esc(dn(s)))+'<div class="sm"><div class="row"><div><div class="mu">Total paid</div><div class="big ok">'+inr(tp)+'</div></div><div style="text-align:right"><div class="mu">Pending</div><div class="big wn">'+inr(td)+'</div></div></div></div>'+rows.reverse().join("")}

  else if(HV.t==="rep"){var L2=S.students.filter(function(s){return s.start<=key&&!s.off}),bill=0,got=0,cash=0,ds=0,pend=0,pn=0,un=[];
    L2.forEach(function(s){var ps=pays(s,key),d=dueOf(s,key);bill+=fb(s,key);ds+=dc(s,key);got+=sum(ps);cash+=sum(ps.filter(function(x){return x.m==="Cash"}));pend+=d;if(d>0)un.push(dn(s)+" – "+inr(d));else pn++});
    RT="Fee report – "+mlab(key)+(S.biz?" ("+S.biz+")":"")+"\n(cycles starting this month)\nBilled: "+inr(bill-ds)+"\nCollected: "+inr(got)+" (Cash "+inr(cash)+", Online "+inr(got-cash)+")\nPending: "+inr(pend)+"\nFully paid: "+pn+" of "+L2.length+(un.length?"\n\nPending:\n"+un.join("\n"):"");
    h=ovHead('Report – '+esc(mlab(key)))+'<div class="sm"><div class="mu">Cycles that start in this month</div><table style="width:100%;margin-top:8px">'+[["Fees billed",inr(bill)],["Discounts","– "+inr(ds)],["Collected",inr(got)],["↳ Cash",inr(cash)],["↳ Online",inr(got-cash)],["Pending",inr(pend)],["Fully paid",pn+" of "+L2.length]].map(function(r){return '<tr><td>'+r[0]+'</td><td style="text-align:right;font-weight:600">'+r[1]+'</td></tr>'}).join("")+'</table></div>'+(un.length?'<div class="sm"><b>Pending</b>'+un.map(function(u){return '<div class="pl"><span>'+esc(u)+'</span></div>'}).join("")+'</div>':'')+'<button class="bt" data-a="cr" style="width:100%">Copy text</button>'}
